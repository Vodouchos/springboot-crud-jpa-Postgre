<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link rel="stylesheet" href="../styles.css" />


</head>
<body>
<div id="main">
    <div class="head" id="head">
        <ul class="menu1">
            <li><a href="https://www.idnes.cz/zpravy" title="Zprávy">Zprávy</a>
                <ul class="menu2">
                    <li><a href="https://www.idnes.cz/zpravy/domaci" title="Domácí">Domácí</a></li>
                    <li><a href="https://www.idnes.cz/zpravy/zahranicni" title="Zahraničí">Zahraničí</a></li>
                </ul>
            </li>
            <li><a href="https://www.idnes.cz/kraje" title="Kraje">Kraje</a>
                <ul class="menu2">
                    <li><a href="https://www.idnes.cz/praha" title="Praha a střední Čechy">Praha a střední Čechy</a>
                    </li>
                    <li><a href="https://www.idnes.cz/brno" title="Brno">Brno</a></li>
                </ul>
            </li>
        </ul>
    </div>
    <div id="content" class="content">
        <div th:each="RSSItem:${items}" class="article-container">
            <div class="article-image-container">
                <a th:href="@{${RSSItem.permaLink}}">
                    <img th:src="@{${RSSItem.thumbLink}}" th:title="${RSSItem.title}" alt="Article Image" class="article-image"
                         onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/1/14/No_Image_Available.jpg';">
                    <span class="publish-date"
                          th:text="${(#dates.createToday().getTime() - RSSItem.pubDate.getTime()) < 86400000}
                                   ? ${#dates.format(RSSItem.pubDate, 'HH:mm')}
                                   : ${#dates.format(RSSItem.pubDate, 'dd. MM. YYYY')}"></span>
                </a>
            </div>
            <div class="article-content">
                <h3 class="article-title"><a th:href="@{${RSSItem.permaLink}}" th:text="${RSSItem.title}"></a></h3>
                <p class="article-summary" th:text="${RSSItem.text}"></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
